<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4be39a"/>
      <stop offset="1" stop-color="#079a72"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef3b4f"/>
      <stop offset="1" stop-color="#b3172b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#04382a" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- macOS squircle tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>

  <!-- tiny flags waving in the corners: Italian and French -->
  <g transform="translate(136 784) rotate(-8)">
    <rect width="46" height="96" fill="#009246"/><rect x="46" width="46" height="96" fill="#fff"/><rect x="92" width="46" height="96" fill="#ce2b37"/>
  </g>
  <g transform="translate(716 742) rotate(8)">
    <rect width="46" height="96" fill="#0055a4"/><rect x="46" width="46" height="96" fill="#fff"/><rect x="92" width="46" height="96" fill="#ef4135"/>
  </g>

  <!-- the speech-bubble guy -->
  <g filter="url(#shadow)">
    <ellipse cx="512" cy="540" rx="300" ry="245" fill="#fff"/>
    <path d="M360 720 L300 850 L470 768 Z" fill="#fff"/>
  </g>

  <!-- beret, cheekily tilted -->
  <g transform="rotate(-14 470 320)">
    <ellipse cx="470" cy="330" rx="205" ry="78" fill="url(#beret)"/>
    <ellipse cx="470" cy="352" rx="190" ry="34" fill="#9c1426" opacity=".55"/>
    <path d="M466 254 q6 -40 26 -44" stroke="#9c1426" stroke-width="16" stroke-linecap="round" fill="none"/>
  </g>

  <!-- rosy cheeks -->
  <circle cx="352" cy="600" r="44" fill="#ff8fa3" opacity=".45"/>
  <circle cx="676" cy="596" r="44" fill="#ff8fa3" opacity=".45"/>

  <!-- googly eyes, looking in two different directions -->
  <circle cx="428" cy="500" r="74" fill="#fff" stroke="#1d2b26" stroke-width="12"/>
  <circle cx="606" cy="492" r="74" fill="#fff" stroke="#1d2b26" stroke-width="12"/>
  <circle cx="452" cy="530" r="34" fill="#1d2b26"/>
  <circle cx="584" cy="460" r="34" fill="#1d2b26"/>
  <circle cx="462" cy="518" r="10" fill="#fff"/>
  <circle cx="594" cy="448" r="10" fill="#fff"/>

  <!-- magnificent handlebar mustache -->
  <path fill="#3a2214" d="
    M512 612
    C 476 570, 404 572, 370 612
    C 348 638, 304 640, 286 606
    C 288 668, 372 694, 438 664
    C 472 648, 496 640, 512 642
    C 528 640, 552 648, 586 664
    C 652 694, 736 668, 738 606
    C 720 640, 676 638, 654 612
    C 620 572, 548 570, 512 612 Z"/>
  <!-- little smile peeking out -->
  <path d="M478 676 q34 26 68 0" stroke="#1d2b26" stroke-width="10" stroke-linecap="round" fill="none"/>
</svg>
